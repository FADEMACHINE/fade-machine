name: Daily MACHINE MODEL check

# Scores today's college basketball games on the checklist, logs qualifying
# plays, locks the day's Top 3 and grades finished picks (scripts/daily_model_check.py).
# Times are UTC (ET is UTC-5 in winter, UTC-4 in summer).
#
# GitHub often delays or drops scheduled runs, and a single 10 AM run missed
# almost every morning. So the lock window has a run every 20 minutes from
# about 10 AM to 1 PM ET: the first one that gets through locks the Top 3, and
# the rest just grade (no API calls). 21:17 UTC is the 4 PM ET rescan for late
# lines; the evening and overnight runs grade West Coast finals.
on:
  schedule:
    - cron: "7,27,47 15,16,17 * 11,12,1,2,3,4 *"
    - cron: "17 19,21,23 * 11,12,1,2,3,4 *"
    - cron: "17 1,3,5 * 11,12,1,2,3,4 *"
  workflow_dispatch:
    inputs:
      force_top3:
        description: "Lock today's Top 3 now, even before 10 AM ET"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-model-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # The app's requirements minus the one-off nflverse loader.
        run: |
          grep -v nfl_data_py requirements.txt > /tmp/requirements-model.txt
          pip install -r /tmp/requirements-model.txt
      - name: Run the model check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python scripts/daily_model_check.py ${{ inputs.force_top3 && '--force-top3' || '' }}
